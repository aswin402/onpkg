[package]
name = "onpkg"
version = "0.1.3"
edition = "2021"
description = "Online Package & Template Manager — scaffold projects, manage skills, cache packages"
authors = ["Aswin"]
license = "MIT"
repository = "https://github.com/aswin402/onpkg"

[[bin]]
name = "onpkg"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
streaming-iterator = "0.1.9"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
anyhow = "1.0"
tiktoken-rs = "0.6"

# Progress & terminal UI
indicatif = "0.18"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# Template engine (Jinja2-compatible, lightweight)
minijinja = "2.20"

# Git operations
git2 = "0.21"

# File system utilities
walkdir = "2"
ignore = "0.4"
glob = "0.3"

# Datetime
chrono = { version = "0.4", features = ["serde"] }

# File watching
notify = "6.1.1"

# Diffing
similar = { version = "2.4", features = ["inline"] }

# Regular expressions
regex = "1.10"

# Version comparison
semver = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Terminal colors
colored = "3"

# Self-update
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
strip = true

[workspace]

